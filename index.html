
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Laptop Finder | Home</title>

    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="min-h-screen bg-[var(--app-bg)] text-[var(--app-text)] transition-colors duration-300">

    <!-- Header -->
    <header class="bg-[var(--app-card)] shadow-sm">

        <nav class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 p-5">

            <!-- Website Logo -->
            <a href="./index.html"
               class="text-xl font-bold text-[var(--app-accent)]">
                Student Laptop Finder
            </a>

            <!-- Navigation Links -->
            <div id="nav-links"
                 class="order-3 hidden w-full flex-col gap-4 border-t border-[var(--app-border)] pt-4 md:order-none md:flex md:w-auto md:flex-row md:items-center md:border-0 md:pt-0">

                <a href="./index.html"
                   aria-current="page"
                   class="font-semibold text-[var(--app-accent)]">
                    Home
                </a>

                <a href="./laptops.html"
                   class="transition hover:text-[var(--app-accent)]">
                    Laptops
                </a>

                <a href="./favorites.html"
                   class="transition hover:text-[var(--app-accent)]">
                    Favorites
                </a>

                <a href="./compare.html"
                   class="transition hover:text-[var(--app-accent)]">
                    Compare
                </a>
            </div>

            <!-- Header Buttons -->
            <div class="flex items-center gap-3">

                <!-- Theme Switch -->
                <button id="theme-toggle"
                        type="button"
                        class="btn-action px-3 py-2 text-sm sm:px-4">
                    Switch Theme
                </button>

                <!-- Mobile Menu -->
                <button id="menu-toggle"
                        type="button"
                        aria-label="Toggle navigation menu"
                        aria-controls="nav-links"
                        aria-expanded="false"
                        class="rounded-lg border border-[var(--app-border)] px-3 py-2 text-xl transition hover:text-[var(--app-accent)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--app-accent)] md:hidden">
                    ☰
                </button>

            </div>

        </nav>
    </header>

    <!-- Main Content -->
    <main class="mx-auto max-w-7xl px-5 py-16">

        <!-- Hero Section -->
        <section class="py-8">

            <h1 class="mb-5 text-3xl font-bold sm:text-4xl lg:text-5xl">
                Find Your Perfect Student Laptop
            </h1>

            <p class="mb-8 max-w-2xl text-lg text-[var(--app-muted)]">
                Browse, save, and compare laptops to find the best one for your needs.
            </p>

            <a href="./laptops.html" class="btn-action">
                Browse Laptops
            </a>

        </section>

        <!-- Statistics Section -->
        <section class="mt-12" aria-labelledby="stats-heading">

            <h2 id="stats-heading"
                class="mb-6 text-2xl font-bold">
                Laptop Statistics
            </h2>

            <div id="home-stats"
                 aria-live="polite"
                 class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
                <!-- Statistics generated by JavaScript -->
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="mt-16 border-t border-[var(--app-border)] bg-[var(--app-card)] p-6 text-center text-sm text-[var(--app-muted)]">

        Student Laptop Finder - SW302 Assignment 2

    </footer>

    <!-- JavaScript Modules -->
    <script type="module">
        import {
            initializeTheme,
            initializeMobileMenu
        } from "./src/js/ui.js";

        initializeTheme();
        initializeMobileMenu();
    </script>

    <script type="module" src="./src/js/home-page.js"></script>

</body>
</html>
